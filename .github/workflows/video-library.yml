name: video-library

# Manual library capture, run post-merge from the Actions tab.
# Compares the manifest before/after capture (new / updated / removed) and
# publishes to S3. Merge pipeline itself runs only e2e (see e2e.yml).

on:
  workflow_dispatch:
    inputs:
      prune:
        description: 'Delete manifest entries (and videos) with no tagged test'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  id-token: write
  contents: read

env:
  BUCKET: demo-video-library-simongerula
  AWS_REGION: ap-southeast-2

jobs:
  capture-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install chromium --with-deps

      - name: Run library capture (video on)
        run: pnpm run test:library
        env:
          CI: true

      - name: Save pre-capture manifest
        run: cp library/manifest.json /tmp/manifest.before.json

      - name: Build manifest
        run: pnpm run build:manifest

      - name: Check manifest diff (new / updated / removed)
        run: node scripts/check-manifest.js --before /tmp/manifest.before.json --after library/manifest.json --results test-results/video-meta ${{ inputs.prune == 'true' && '--prune' || '' }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync library to S3
        run: |
          aws s3 sync library/ "s3://$BUCKET/library/" --delete
          aws s3 sync viewer/ "s3://$BUCKET/viewer/" --delete
          aws s3 cp index.html "s3://$BUCKET/index.html" --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ secrets.DISTRIBUTION_ID }}" --paths "/*"
