name: video-library

# Re-runs changed e2e specs with video recording and publishes to S3.
# Normal PR checks stay in e2e.yml (if present); this workflow only runs
# when tests change on the default branch.

on:
  push:
    branches: [master, main]
    paths:
      - 'tests/**'
      - 'playwright.config.ts'
      - 'lib/video-reporter.ts'
      - 'scripts/build-manifest.js'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  BUCKET: demo-video-library-simongerula
  AWS_REGION: ap-southeast-2

jobs:
  capture-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install chromium --with-deps

      - name: Run library capture (video on)
        run: pnpm run test:library
        env:
          CI: true

      - name: Build manifest
        run: pnpm run build:manifest

      # TEMPORARY DEBUG: decode OIDC claims to fix trust mismatch. Remove after.
      - name: Debug OIDC claims (temporary)
        run: |
          resp=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          token=$(echo "$resp" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "$token" | cut -d. -f2 | python3 -c "import sys,base64,json; s=sys.stdin.read().strip(); s+='='*(-len(s)%4); d=json.loads(base64.urlsafe_b64decode(s)); print(json.dumps({k:d.get(k) for k in ('iss','aud','sub')}, indent=2))"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync library to S3
        run: |
          aws s3 sync library/ "s3://$BUCKET/library/" --delete
          aws s3 sync viewer/ "s3://$BUCKET/viewer/" --delete
